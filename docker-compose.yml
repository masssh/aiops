version: "3.9"

# Self-hosted Langfuse monitoring stack
# Usage:
#   1. Copy .env.example to .env and fill in values
#   2. docker compose up -d
#   3. Open http://localhost:3000 and create a project to obtain API keys
#   4. Set LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY in your .env

services:
  # ----------------------------------------------------------------
  # PostgreSQL – primary data store for Langfuse
  # ----------------------------------------------------------------
  langfuse-db:
    image: postgres:15-alpine
    container_name: langfuse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_secret
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - langfuse-net

  # ----------------------------------------------------------------
  # Langfuse application server
  # ----------------------------------------------------------------
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse
    restart: unless-stopped
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_secret@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: changeme_nextauth_secret_32chars_min
      SALT: changeme_salt_value
      # Disable sign-up restriction for local development
      AUTH_DISABLE_USERNAME_PASSWORD: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      # Telemetry opt-out (optional)
      TELEMETRY_ENABLED: "false"
      # Bind Next.js to all interfaces so the health check can reach it via 127.0.0.1
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - langfuse-net

volumes:
  langfuse_db_data:
    driver: local

networks:
  langfuse-net:
    driver: bridge
