[tools]
python = "3.11"

[tasks.install]
description = "Install dependencies into .venv"
run = """
[ -d .venv ] || python -m venv .venv
.venv/bin/pip install -e ".[dev]"
"""

# ---------------------------------------------------------------------------
# github agent
# ---------------------------------------------------------------------------

[tasks.github]
description = "GitHub agent — interactive: mise run github [-- --debug]"
run = ".venv/bin/python -m src.agents.github.agent $@"

[tasks."github:test"]
description = "GitHub agent — test: clone octocat/Hello-World"
run = ".venv/bin/python -m src.agents.github.agent --query \"Clone https://github.com/octocat/Hello-World into ./workspace/repos\""

# ---------------------------------------------------------------------------
# mise agent
# ---------------------------------------------------------------------------

[tasks.mise]
description = "mise agent — interactive: mise run mise [-- --repository-path /path]"
run = ".venv/bin/python -m src.agents.mise.agent $@"

[tasks."mise:test"]
description = "mise agent — test: search for node and use version 20"
run = ".venv/bin/python -m src.agents.mise.agent --query \"Search for node, list available versions, then use version 20\""

# ---------------------------------------------------------------------------
# main (orchestrator) agent
# ---------------------------------------------------------------------------

[tasks.main]
description = "Main orchestrator agent — interactive: mise run main [-- --debug]"
run = ".venv/bin/python -m src.agents.main.agent $@"

[tasks."main:test"]
description = "Main orchestrator agent — test: clone octocat/Hello-World and octocat/Spoon-Knife in parallel"
run = ".venv/bin/python -m src.agents.main.agent --query \"Clone https://github.com/octocat/Hello-World and https://github.com/octocat/Spoon-Knife\""
