[tools]
python = "3.11"

[tasks.install]
description = "Install dependencies into .venv"
run = """
[ -d .venv ] || python -m venv .venv
.venv/bin/pip install -e ".[dev]"
"""

# ---------------------------------------------------------------------------
# github agent
# ---------------------------------------------------------------------------

[tasks.github]
description = "GitHub agent — interactive: mise run github [-- --debug]"
run = ".venv/bin/python -m src.agents.github.agent $@"

[tasks."github:test"]
description = "GitHub agent — test: clone octocat/Hello-World"
run = '''
.venv/bin/python -m src.agents.github.agent --query "Clone https://github.com/gradle-samples/Building-Spring-Boot-Web-Applications-Kotlin into ./workspace/repos"
'''

# ---------------------------------------------------------------------------
# mise agent
# ---------------------------------------------------------------------------

[tasks.mise]
description = "mise agent — interactive: mise run mise [-- --project-path /path]"
run = ".venv/bin/python -m src.agents.mise.agent $@"

[tasks."mise:test"]
description = "mise agent — test: search for node and use version 20"
env.QUERY = "Search for node, list available versions, then use version 20"
run = '''
.venv/bin/python -m src.agents.mise.agent \
  --query "$QUERY" \
  --project-path ./workspace/repos/Building-Spring-Boot-Web-Applications-Kotlin
'''

# ---------------------------------------------------------------------------
# sbom agent
# ---------------------------------------------------------------------------

[tasks.sbom]
description = "SBOM agent — interactive: mise run sbom [-- --project-path /path]"
run = ".venv/bin/python -m src.agents.sbom.agent $@"

[tasks."sbom:test"]
description = "SBOM agent — test: generate and analyse SBOM for a cloned repo"
env.QUERY = "Generate the SBOM and get application dependencies"
run = '''
.venv/bin/python -m src.agents.sbom.agent \
  --query "$QUERY" \
  --project-path ./workspace/repos/Building-Spring-Boot-Web-Applications-Kotlin
'''

# ---------------------------------------------------------------------------
# repository_analyzer agent
# ---------------------------------------------------------------------------

[tasks.repository-analyzer]
description = "Repository analyzer agent — interactive: mise run repository-analyzer [-- --project-path /path]"
run = ".venv/bin/python -m src.agents.repository_analyzer.agent $@"

[tasks."repository-analyzer:test"]
description = "Repository analyzer agent — test: analyse a cloned repo"
env.QUERY = "List the top-level packages and summarise the overall structure of this repository"
run = '''
.venv/bin/python -m src.agents.repository_analyzer.agent \
  --query "$QUERY" \
  --project-path ./workspace/repos/Building-Spring-Boot-Web-Applications-Kotlin
'''

# ---------------------------------------------------------------------------
# main (orchestrator) agent
# ---------------------------------------------------------------------------

[tasks.main]
description = "Main orchestrator agent — interactive: mise run main [-- --debug]"
run = ".venv/bin/python -m src.agents.main.agent $@"

[tasks."main:test"]
description = "Main orchestrator agent — test: clone octocat/Hello-World and octocat/Spoon-Knife in parallel"
run = '''
.venv/bin/python -m src.agents.main.agent --query "Clone https://github.com/octocat/Hello-World and https://github.com/octocat/Spoon-Knife"
'''
