modules:
- dependencies:
    external: []
    internal: []
  name: model
  path: model
  type: library
- dependencies:
    external:
    - org.springframework.boot:spring-boot-starter:3.2.2
    internal:
    - :model
  name: service
  path: service
  type: library
- dependencies:
    external:
    - org.springframework.boot:spring-boot-starter-web:3.2.2
    - org.springframework.boot:spring-boot-starter-test:3.2.2 (test)
    internal:
    - :service
  name: app
  path: app
  type: main_application
technology_stack:
  build_tool: Gradle (Kotlin DSL)
  framework: Spring Boot
  framework_version: 3.2.2
  java_version: 17
  language: Java
