[project]
name = "aiops-repo-analyzer"
version = "0.1.0"
description = "Multi-agent repository analysis system using LangGraph and Gemini"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.0.15",
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "google-generativeai>=0.3.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
