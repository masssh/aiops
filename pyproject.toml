[project]
name = "aiops-repo-analyzer"
version = "0.1.0"
description = "Multi-agent repository analysis system using LangGraph and Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.0.15",
    "langchain>=0.1.0",
    "langchain-google-genai>=1.0.0",
    "langchain-openai>=1.1.9",
    "langchain-anthropic>=1.3.3",
    "langchain-ollama>=1.0.1",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.4",
    "ipykernel>=7.2.0",
    "loguru>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
no_implicit_optional = false
explicit_package_bases = true
mypy_path = "."
exclude = [
    "^.venv/",
    "^workspace/",
]
