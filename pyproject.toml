[project]
name = "aiops"
version = "0.1.0"
description = "Scalable multi-agent system powered by LangChain/LangGraph and Gemini"
requires-python = ">=3.11"
dependencies = [
    # LangChain core
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-google-genai>=2.0",
    # LangGraph for agent orchestration
    "langgraph>=0.2",
    # Monitoring
    "langfuse>=2.0",
    # Logging
    "loguru>=0.7",
    # Configuration
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Utilities
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
aiops = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
